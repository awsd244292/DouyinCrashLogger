name: build deb

on:
  push:
    branches:
      - main
    paths:
      - '*.h'
      - '*.m'
      - '*.mm'
      - '*.x'
      - '*.xm'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.s'
      - '*.S'
      - 'DouyinCrashLogger.plist'
      - 'control'
      - 'Makefile'
      - 'scripts/**'
      - 'tools/**'
      - 'Resources/**'
      - 'layout/**'
  workflow_dispatch:
    inputs:
      scheme:
        description: '打包方案（默认 rootful；自签/巨魔用户只用产出的 dylib 注入到抖音）'
        required: false
        default: 'rootful'
        type: choice
        options:
          - rootful
          - all
          - rootless
          - roothide

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.relevance.outputs.should_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: relevance
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             .github/scripts/build-relevance.sh range "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build-relevant plugin, package, or Makefile changes detected."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only non-build Makefile settings changed; skipping build."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # 为什么不再用 iPhoneOS14.5.sdk：面板用的 iOS 15 Bottom Sheet
    # （UISheetPresentationController / Detent）在 14.5 头文件里根本不存在，编译直接挂。
    #
    # 为什么 MIN_IOS 从 14.0 提到 15.0：
    #   1) 抖音当前 App Store 已要求 iOS 15.0+，14 的门禁保的是一群装不上抖音的设备；
    #   2) iPhoneOS16.5 SDK 下 @available 会编译成对 __isPlatformVersionAtLeast 的调用，
    #      而 theos 精简 SDK 的 libSystem.B.tbd 并没有导出这个符号（实测 grep 命中 0 次），
    #      链接期必报 undefined symbol。部署目标抬到 15.0 后，@available(iOS 15.0 及以下)
    #      被编译器判为恒真、不再生成该调用 —— 这才是根上的解法，
    #      比补一个编译器内部符号的自定义实现干净得多。
    env:
      SDK_VERSION: iPhoneOS16.5.sdk
      MIN_IOS: "15.0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install toolchain (clang + llvm-lld)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld llvm
          clang --version
          ls "$(dirname "$(readlink -f "$(which clang)")")" | grep -E 'ld64\.lld'

      - name: Static precheck (no SDK needed)
        run: make precheck

      - name: Build injectable dylib (arm64; auto-fetches SDK on first run)
        run: make dylib

      - name: Build .deb (rootful; 巨魔/自签注入只用上面的 dylib)
        run: make deb

      - name: Read package version
        id: package
        run: |
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (dylib + deb)
        uses: actions/upload-artifact@v7
        with:
          name: DouyinCrashLogger-${{ steps.package.outputs.version }}
          # 只上传带版本号的 dylib：不带版本号的 build/DouyinCrashLogger.dylib
          # 不含下划线，匹配不到这里的 *_*.dylib，不会重复上传一份。
          path: |
            build/DouyinCrashLogger_*.dylib
            build/DouyinCrashLogger_*.deb
